<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Tareas</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; color: #333; text-align: center; padding: 50px; }
        .contenedor { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        h1 { color: #0056b3; }
        ul { text-align: left; background: #e9ecef; padding: 15px 30px; border-radius: 8px; list-style-type: none; }
        li { margin-bottom: 10px; border-bottom: 1px solid #ccc; padding-bottom: 5px;}
        li:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0;}
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>¡Bienvenido al Sistema de Gestión de Tareas!</h1>
        <p><strong>{{ usuario|capitalize }}</strong>, estas son tus tareas por realizar:</p>
        
        {% if tareas %}
            <ul>
            {% for tarea in tareas %}
                <li>✅ {{ tarea }}</li>
            {% endfor %}
            </ul>
        {% else %}
            <p><em>No tenés tareas guardadas todavía. ¡Aprovechá para descansar!</em></p>
        {% endif %}
    </div>
</body>
</html>
